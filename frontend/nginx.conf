# Serves the React build and proxies /api to the backend on the same origin
# (the same shape as CloudFront routing /api/* to the API in production; no CORS needed).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Vite puts content-hashed files in /assets, so they can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routes (/category/..., /products/...) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
